---
name: Build macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: macOS package version in YY.MM.DD format
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            ver="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            echo "error: no version specified or inferred from tag" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_macosPackageVersion=$ver" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: jetbrains
          # renovate: datasource=github-releases depName=JetBrains/JetBrainsRuntime
          java-version: "25"
          architecture: aarch64
          cache: gradle

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install just
        run: brew install just

      - name: Build and verify macOS DMG
        run: just checkminversion

      - name: Verify DMG contents
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find composeApp/build/compose/binaries/main-release/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount_dir=$(mktemp -d)
          trap 'diskutil eject "$mount_dir" >/dev/null || true; rmdir "$mount_dir" || true' EXIT
          diskutil image attach --readOnly --nobrowse --mountPoint "$mount_dir" "$dmg"
          app=$(find "$mount_dir" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist" | grep -Fx 'chat.schildi.revenge'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist" | grep -Fx matrix
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleTypeRole' "$app/Contents/Info.plist" | grep -Fx Viewer
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:1:CFBundleURLSchemes:0' "$app/Contents/Info.plist" | grep -Fx schildichat
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:1:CFBundleTypeRole' "$app/Contents/Info.plist" | grep -Fx Viewer
          ./scripts/check-macos-dylib.sh "$app"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error
          archive: false

      - name: Publish GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          dmg=$(find composeApp/build/compose/binaries/main-release/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"

          notes_file=$(mktemp)
          if gh release view "$TAG" --repo SchildiChat/schildi-revenge --json body -q .body > "$notes_file" 2>/dev/null && [[ -s "$notes_file" ]]; then
            printf '\n\n### macOS installation\n\nThe DMG is currently not signed with an Apple Developer ID or notarized. macOS Gatekeeper therefore requires manual confirmation before the first launch.\n' >> "$notes_file"
          else
            cat << 'EOF' > "$notes_file"
          ### macOS installation

          The DMG is currently not signed with an Apple Developer ID or notarized. macOS Gatekeeper therefore requires manual confirmation before the first launch.
          EOF
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes_file"
            gh release upload "$TAG" "$dmg" --clobber
          else
            gh release create "$TAG" "$dmg" --title "$TAG" --notes-file "$notes_file"
          fi

